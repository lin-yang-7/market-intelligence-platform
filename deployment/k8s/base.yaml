          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
