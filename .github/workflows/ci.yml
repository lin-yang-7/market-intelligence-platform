name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check backend ai-engine data-platform scripts sdk

      - name: Test
        run: python -m pytest

      - name: Smoke import
        run: python scripts/smoke_apps_import.py

      - name: Disaster recovery readiness
        run: python scripts/disaster_recovery_check.py

      - name: Kubernetes manifest validation
        run: python scripts/validate_k8s_manifests.py

      - name: Monitoring config validation
        run: python scripts/validate_monitoring_config.py

      - name: CD workflow validation
        run: python scripts/validate_cd_workflow.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build -f backend/Dockerfile.service -t market-intelligence-service:ci .

      - name: Docker integration test
        run: python scripts/docker_integration_test.py --mode full --service auth-service
