apiVersion: v1
kind: Namespace
metadata:
  name: market-intelligence
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mip-config
  namespace: market-intelligence
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DATABASE: market_intelligence
  MARKET_SERVICE_URL: http://market-service:8001
  FEATURE_SERVICE_URL: http://feature-service:8003
  FEATURE_STORE_SERVICE_URL: http://feature-store-service:8016
  RANKING_SERVICE_URL: http://ranking-service:8004
  SIGNAL_SERVICE_URL: http://signal-service:8005
  ALERT_SERVICE_URL: http://alert-service:8006
  RULE_SERVICE_URL: http://rule-service:8015
  SCREENER_SERVICE_URL: http://screener-service:8007
  HISTORY_SERVICE_URL: http://history-service:8009
  AI_SERVICE_URL: http://ai-engine:8010
  SCORE_SERVICE_URL: http://score-service:8014
  NOTIFICATION_SERVICE_URL: http://notification-service:8012
  USER_SERVICE_URL: http://user-service:8013
  DATA_PLATFORM_URL: http://data-platform:8011
  WEBSOCKET_SERVICE_URL: http://websocket-service:8008
  REPOSITORY_BACKEND: redis
  DATA_PLATFORM_STORAGE_BACKEND: clickhouse
  AI_SCORING_ENABLED: "true"
  SCORE_SERVICE_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: mip-secrets
  namespace: market-intelligence
type: Opaque
stringData:
  # Replace before applying. Production/staging services reject this placeholder at startup.
  JWT_SECRET: REPLACE_WITH_STRONG_SECRET
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  NOTIFICATION_WEBHOOK_URL: ""
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: market-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: market-intelligence-service:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.api_gateway.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mip-config
            - secretRef:
                name: mip-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: market-intelligence
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
