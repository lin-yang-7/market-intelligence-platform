# Copy to /etc/nginx/conf.d/market-intelligence-lite.conf after replacing
# lite.example.com with the actual DNS name.
server {
    listen 80;
    listen [::]:80;
    server_name lite.example.com;

    # ^~ prevents aaPanel's generic static-file regex locations from serving
    # /assets/* from the host website root instead of the frontend container.
    location ^~ / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
