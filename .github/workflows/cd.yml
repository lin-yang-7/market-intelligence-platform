name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment.
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: Optional image tag. Defaults to the current commit SHA.
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/market-intelligence-service

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run local CI checks
        run: python scripts/run_ci.py

  package:
    name: Build and push image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "image_ref=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -f backend/Dockerfile.service -t "${{ steps.meta.outputs.image_ref }}" .

      - name: Push image
        run: docker push "${{ steps.meta.outputs.image_ref }}"

  deploy:
    name: Deploy
    needs: package
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export SERVICE_IMAGE="${{ needs.package.outputs.image_ref }}"
            docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.prod.yml pull || true
            docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.prod.yml up -d
            docker image prune -f

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify deployment
        run: |
          BASE_URL="${{ secrets.DEPLOY_HEALTH_URL }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://${{ secrets.DEPLOY_HOST }}:8000"
          fi
          python scripts/check_deployment_health.py --base-url "$BASE_URL"

  rollback-note:
    name: Rollback instructions
    needs:
      - package
      - deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Print rollback instruction
        run: |
          echo "Deployment failed."
          echo "Rollback by re-running this workflow with the previous known-good image_tag."
          echo "Target image attempted: ${{ needs.package.outputs.image_ref }}"
