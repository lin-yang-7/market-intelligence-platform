# Lite frontend reverse proxy.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The browser needs these two read models. Everything else (including API
  # docs, SDK-oriented endpoints and the WebSocket service) stays internal.
  location = /api/v1/ranking/overall {
    proxy_pass http://api-gateway:8000/v1/ranking/overall;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /api/v1/market/ticker {
    proxy_pass http://api-gateway:8000/v1/market/ticker;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { try_files $uri $uri/ /index.html; }
}
