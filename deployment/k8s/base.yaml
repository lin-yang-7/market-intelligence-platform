  template:
    metadata:
      labels:
        app: ranking-monitor-worker
    spec:
      containers:
        - name: ranking-monitor-worker
          image: market-intelligence-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.ranking_service.app.monitor_worker"]
          envFrom:
            - configMapRef:
                name: mip-config
            - secretRef:
                name: mip-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mip-ingress
  namespace: market-intelligence
spec:
  rules:
    - host: mip.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
